services:

  db:
    image: postgres:16-alpine
    container_name: residuos-postgres
    environment:
      POSTGRES_DB: residuos
      POSTGRES_USER: ${DB_USERNAME:-residuos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-residuos_pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d residuos"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - residuos-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: residuos-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/residuos
      DB_USERNAME: ${DB_USERNAME:-residuos_user}
      DB_PASSWORD: ${DB_PASSWORD:-residuos_pass}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - residuos-network

networks:
  residuos-network:
    driver: bridge

volumes:
  postgres-data:
